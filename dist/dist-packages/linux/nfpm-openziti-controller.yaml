# nfpm configuration file
#
# check https://nfpm.goreleaser.com/configuration for detailed usage
#
name: openziti-controller
arch: ${NFPM_ARCH}
platform: linux
version: ${ZITI_VERSION}
prerelease: ${ZITI_REV}
maintainer: ${ZITI_MAINTAINER}
description: >
  Provides a system service for running an OpenZiti Controller
vendor: ${ZITI_VENDOR}
homepage: ${ZITI_HOMEPAGE}
license: Apache-2.0
# Contents to add to the package.
contents:
  - dst: /lib/systemd/system/
    src: ./dist/dist-packages/linux/openziti-controller/ziti-controller.service

  - dst: /opt/openziti/etc/controller/
    type: dir
    file_info:
      mode: 0755

  - dst: /opt/openziti/etc/controller/
    src: ./dist/dist-packages/linux/openziti-controller/service.env
    type: config|noreplace

  - dst: /opt/openziti/etc/controller/
    src: ./dist/dist-packages/linux/openziti-controller/bootstrap.env
    type: config|noreplace

  - dst: /opt/openziti/etc/controller/
    src: ./dist/dist-packages/linux/openziti-controller/bootstrap.bash

  - dst: /opt/openziti/etc/controller/
    src: ./dist/dist-packages/linux/openziti-controller/entrypoint.bash

  - dst: /etc/systemd/system/ziti-controller.service.d/override.conf
    src: ./dist/dist-packages/linux/openziti-controller/override.conf
    type: config|noreplace

  - dst: /usr/lib/tmpfiles.d/openziti-controller.conf
    src: ./dist/dist-packages/linux/openziti-controller/openziti-controller.tmpfiles.conf

scripts:
  postinstall: ./dist/dist-packages/linux/openziti-controller/postinstall.bash
  postremove: ./dist/dist-packages/linux/openziti-controller/postrm

deb:
  scripts:
    templates: ./dist/dist-packages/linux/openziti-controller/templates
    config: ./dist/dist-packages/linux/openziti-controller/config

depends:
  - openziti  # ziti CLI
  - systemd (>= ${MINIMUM_SYSTEMD_VERSION})

overrides:
  deb:
    # debconf is Debian-only; a shared top-level "depends" would land an
    # unsatisfiable "debconf" Requires on the rpm build. overrides.deb.depends
    # replaces the whole list for deb, so the common deps are repeated here.
    depends:
      - openziti  # ziti CLI
      - systemd (>= ${MINIMUM_SYSTEMD_VERSION})
      - debconf (>= 0.5) | debconf-2.0



name: Backward Compatibility Test
run-name: ${{ (inputs.ctrl_version || inputs.router_version_a || inputs.router_version_b) && format('Backward Compatibility Test (ctrl {0}, routers {1} and {2})', inputs.ctrl_version || 'branch', inputs.router_version_a || 'branch', inputs.router_version_b || 'branch') || 'Backward Compatibility Test' }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      router_version_a:
        description: 'Router release to compare, such as v2.0.8, or blank for the branch build. Setting any version runs these in place of the release line matrix'
        type: string
        required: false
      router_version_b:
        description: 'Router release to compare against A, such as v1.5.4. Runs A on the client side (east) with B hosting (west), then B east with A west'
        type: string
        required: false
      ctrl_version:
        description: "Controller release, such as v2.0.8, or blank for the branch build. It must be on the branch's major.minor line: run a 2.0 controller from release-v2.0.x"
        type: string
        required: false
      labels:
        description: 'Extra fablab labels for every job, comma separated, such as capability_oidc=on'
        type: string
        required: false

# cancel older, redundant runs of same workflow on same branch. Under workflow_call, github.workflow
# names the caller, so the suffix keeps this group distinct from the caller's other jobs. A manual
# run's inputs are part of the group, so runs comparing different versions don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{github.event_name}}-${{ github.head_ref || github.ref_name }}-backward-compatibility-${{ inputs.ctrl_version }}-${{ inputs.router_version_a }}-${{ inputs.router_version_b }}-${{ inputs.labels }}
  cancel-in-progress: true

env:
  GOFLAGS: "-trimpath"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: "us-east-2"
  gh_ci_key: ${{ secrets.GH_CI_KEY }}
  BUILD_NUMBER: ${{ format('{0}-{1}-{2}', github.run_id, github.run_number, github.run_attempt) }}

jobs:
  fablab-compat-smoketest:
    name: Fablab Compat Smoketest - ${{ matrix.line != 'pinned' && format('{0}-{1}', matrix.side, matrix.line) || format('east {0}, west {1}', matrix.side == 'a-east' && (inputs.router_version_a || 'branch') || (inputs.router_version_b || 'branch'), matrix.side == 'a-east' && (inputs.router_version_b || 'branch') || (inputs.router_version_a || 'branch')) }}
    if: github.repository_owner == 'openziti'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each release line runs with the old routers on the client side (east) and, separately, on
        # the hosting side (west), against the newest stable (promoted) release of that line. A manual
        # run that pins any version pairs the two router versions both ways: a-east puts A on the
        # client side and B hosting, b-east the reverse. Two equal versions run once.
        line: ${{ fromJSON((inputs.ctrl_version || inputs.router_version_a || inputs.router_version_b) && '["pinned"]' || '["2.0", "1.6"]') }}
        side: ${{ fromJSON(!(inputs.ctrl_version || inputs.router_version_a || inputs.router_version_b) && '["east", "west"]' || inputs.router_version_a == inputs.router_version_b && '["a-east"]' || '["a-east", "b-east"]') }}

    steps:
      - name: Resolve Versions
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ matrix.line }}
          SIDE: ${{ matrix.side }}
          CTRL_VERSION: ${{ inputs.ctrl_version }}
          ROUTER_VERSION_A: ${{ inputs.router_version_a }}
          ROUTER_VERSION_B: ${{ inputs.router_version_b }}
        shell: bash
        run: |
          if [ "$LINE" = pinned ]; then
            case "$SIDE" in
              a-east) east=$ROUTER_VERSION_A west=$ROUTER_VERSION_B ;;
              b-east) east=$ROUTER_VERSION_B west=$ROUTER_VERSION_A ;;
              *) echo "unknown side $SIDE" >&2; exit 1 ;;
            esac

            labels=""
            summary=""
            for pin in "controllers:ctrl1 ctrl2 ctrl3:$CTRL_VERSION" "east routers:router_east_1 router_east_2:$east" "west router:router_west:$west"; do
              name=${pin%%:*}
              rest=${pin#*:}
              components=${rest%%:*}
              version=${rest#*:}

              if [ -z "$version" ]; then
                summary="${summary:+$summary, }$name on the branch build"
                continue
              fi
              version=v${version#v}
              if [[ ! $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                echo "$name: $version is not a release version" >&2
                exit 1
              fi
              if ! gh release view "$version" --repo openziti/ziti --json tagName > /dev/null; then
                echo "$name: openziti/ziti has no release $version" >&2
                exit 1
              fi

              for component in $components; do
                labels="${labels:+$labels,}${component}_version=$version"
              done
              summary="${summary:+$summary, }$name on $version"
            done

            echo "VERSION_LABELS=$labels" >> "$GITHUB_ENV"
            echo "Testing $summary (labels: $labels)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          releases=$(gh release list --repo openziti/ziti --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
          version=$(grep -E "^v${LINE//./\\.}\.[0-9]+$" <<< "$releases" | sort -V | tail -n 1 || true)
          if [ -z "$version" ]; then
            echo "no stable release found for line $LINE" >&2
            exit 1
          fi

          case "$SIDE" in
            east) labels="router_east_1_version=$version,router_east_2_version=$version" ;;
            west) labels="router_west_version=$version" ;;
            *) echo "unknown side $SIDE" >&2; exit 1 ;;
          esac

          echo "VERSION_LABELS=$labels" >> "$GITHUB_ENV"
          echo "Testing $SIDE routers on $version (labels: $labels)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          module-dirs: '. zititest'

      - name: Install Ziti CI
        uses: openziti/ziti-ci@v1

      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.5

      - name: Build and Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ziti_ci_gpg_key: ${{ secrets.ZITI_CI_GPG_KEY }}
          ziti_ci_gpg_key_id: ${{ secrets.ZITI_CI_GPG_KEY_ID }}
        shell: bash
        run: |
          $(go env GOPATH)/bin/ziti-ci configure-git
          $(go env GOPATH)/bin/ziti-ci generate-build-info common/version/info_generated.go version
          pushd zititest && go mod tidy && go install -tags all ./... && popd
          go install -tags=all,tests ./...

      - name: Create Test Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # inputs reach the script through the environment, never interpolated into it
          EXTRA_LABELS: ${{ inputs.labels }}
        shell: bash
        run: |
          echo "ZITI_ROOT=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
          $(go env GOPATH)/bin/smoketest create -d smoketest-compat-${{ matrix.side }}-${{ matrix.line }}-${GITHUB_RUN_NUMBER} -n smoketest-compat-${{ matrix.side }}-${{ matrix.line }}-${GITHUB_RUN_NUMBER} -l "${VERSION_LABELS},environment=gh-fablab-compat-smoketest${EXTRA_LABELS:+,$EXTRA_LABELS}"
          $(go env GOPATH)/bin/smoketest up

      - name: Validate Links
        shell: bash
        run: |
          $(go env GOPATH)/bin/smoketest exec validateLinks

      - name: Test Ziti Command
        shell: bash
        run: |
          echo "ZITI_ROOT=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
          pushd zititest && go test -timeout 30m -v ./tests/... 2>&1 | tee test.out && popd

      - name: Stop Fablab
        # a cancelled step leaves fablab and terraform running, and teardown needs terraform's final state
        if: always()
        timeout-minutes: 15
        uses: ./.github/actions/stop-fablab
        with:
          model: smoketest

      - name: Create Logs Archive
        if: always()
        run: |
          # compress large logs on the hosts, so fetching them can't fill the runner's disk
          $(go env GOPATH)/bin/smoketest sshexec '*' 'find logs -type f -name "*.log" -size +10M -exec gzip -f {} +' -c 10 \
            || echo "::warning::compressing logs on the hosts failed; fetching them uncompressed"
          $(go env GOPATH)/bin/smoketest get files '*' "./logs/{{ .Id }}/" ./logs

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-compat-${{ matrix.side }}-${{ matrix.line }}-${{ github.run_id }}
          path: logs/
          compression-level: 7
          retention-days: 5

      - name: Test Report Generation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          $(go env GOPATH)/bin/go-junit-report -in zititest/test.out -out test-report.xml

      - name: Test Summary
        uses: test-summary/action@v2
        if: ${{ !cancelled() }}
        with:
          paths: |
            test-report.xml
          show: "fail, skip"

      - name: Tear down Test Environment
        timeout-minutes: 30
        if: always()
        shell: bash
        run: |
          $(go env GOPATH)/bin/smoketest dispose

name: Add to Triage Project

on:
  issues:
    types: [ opened ]
  pull_request_target:
    types: [ opened ]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      !contains(fromJson('["andrewpmartinez", "CLBRITTON2", "dovholuknf", "ekoby", "emoscardini", "michaelquigley", "mikegorman-nf", "plorenz", "scareything", "smilindave26"]'), github.actor)
    steps:
      - name: Mint project token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.TRIAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
          owner: openziti
          permission-organization-projects: write

      - name: Add to project
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05  # v2.0.1
        with:
          project-url: https://github.com/orgs/openziti/projects/38
          github-token: ${{ steps.app-token.outputs.token }}

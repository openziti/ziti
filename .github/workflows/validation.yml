name: Validation (All)
run-name: ${{ format('Validation (All, {0}{1})', inputs.cluster_mode, !inputs.oidc && ', OIDC off' || '') }}

# Runs every validation with the controllers in one mode. The Validation (All, ...) workflows call it,
# one per mode; dispatching it directly picks the mode by hand.
on:
  workflow_call:
    inputs:
      cluster_mode:
        description: How the controllers run, cluster-3, cluster-1 or non-ha
        type: string
        required: true
      oidc:
        description: Whether the controllers serve the OIDC API. Only non-ha can turn it off
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      cluster_mode:
        description: How the controllers run
        type: choice
        options:
          - cluster-3
          - cluster-1
          - non-ha
        default: cluster-3
      oidc:
        description: Whether the controllers serve the OIDC API. Only non-ha can turn it off
        type: boolean
        default: true

# The backward compatibility smoke tests run first, and the soak validations start once they finish,
# whatever their result. Running everything at once would put ten fablab environments, each with its
# own VPC, in us-east-1 at the same time.
jobs:
  backward-compatibility:
    name: Backward Compatibility
    uses: ./.github/workflows/backward-compatibility.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

  circuit-validation:
    name: Circuit Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-circuits.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

  ert-terminator-validation:
    name: ER/T Terminator Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-ert-terminators.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

  sdk-terminator-validation:
    name: SDK Terminator Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-sdk-terminators.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

  link-validation:
    name: Link Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-links.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

  router-data-model-validation:
    name: Router Data Model Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-router-data-model.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

  sdk-status-validation:
    name: SDK Status Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-sdk-status.yml
    secrets: inherit
    with:
      cluster_mode: ${{ inputs.cluster_mode }}
      oidc: ${{ inputs.oidc }}

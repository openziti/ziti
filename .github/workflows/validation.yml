name: Validation (All)

on:
  workflow_dispatch:

# The backward compatibility smoke tests run first, and the soak validations start once they finish,
# whatever their result. Running everything at once would put ten fablab environments, each with its
# own VPC, in us-east-1 at the same time.
jobs:
  backward-compatibility:
    name: Backward Compatibility
    uses: ./.github/workflows/backward-compatibility.yml
    secrets: inherit

  circuit-validation:
    name: Circuit Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-circuits.yml
    secrets: inherit

  ert-terminator-validation:
    name: ER/T Terminator Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-ert-terminators.yml
    secrets: inherit

  sdk-terminator-validation:
    name: SDK Terminator Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-sdk-terminators.yml
    secrets: inherit

  link-validation:
    name: Link Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-links.yml
    secrets: inherit

  router-data-model-validation:
    name: Router Data Model Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-router-data-model.yml
    secrets: inherit

  sdk-status-validation:
    name: SDK Status Validation
    needs: backward-compatibility
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/validation-sdk-status.yml
    secrets: inherit
